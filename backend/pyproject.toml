[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-analytics-api"
version = "0.1.0"
description = "Local API for the Aspire SNF analytics demo"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
demo = [] # Generators use the standard library and shared persistence dependencies.
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
seed-all = "seeding.cli:main"
refresh-reports = "reporting.cli:main"
schema-upgrade = "data.migrations.__main__:main"
seed-facilities = "app.seed_facilities:main"
seed-admissions = "app.seed_admissions:main"
seed-discharges = "app.seed_discharges:main"
seed-payer-changes = "app.seed_payer_changes:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "common", "data", "domain", "reporting", "seeding", "app", "tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "common*", "data*", "domain*", "reporting*", "seeding*", "app*"]
exclude = ["tests*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
