# Optional: keep using an existing PostgreSQL database instead of creating a new one.
# Docker Compose v2 supports !reset to remove the bundled database dependencies.
x-external: &external
  depends_on: !reset {}
  environment:
    DATABASE_URL: ${EXTERNAL_DATABASE_URL:?Set EXTERNAL_DATABASE_URL in .env.docker for the existing database}
  extra_hosts:
    # Define the host alias on native Linux as well as Docker Desktop. Override
    # the gateway only for a Docker installation with a custom host route.
    - "host.docker.internal:${DOCKER_HOST_GATEWAY:-host-gateway}"

services:
  db:
    profiles: ["bundled-database"]
  api:
    <<: *external
  migrate:
    <<: *external
  seed:
    <<: *external
  reporting:
    <<: *external
